services:
  - type: web
    name: adk-hiring-agent
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: ./start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: GEMINI_API_KEY
        sync: false
      - key: MODEL_NAME
        value: gemini-3.5-flash
      - key: GITHUB_TOKEN
        sync: false
